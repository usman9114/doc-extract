# Variables come from .env (copy .env.example) or your shell; compose reads .env automatically.
x-env: &env
  LLM_PROVIDER: ${LLM_PROVIDER:-zai}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_VISION_MODEL: ${LLM_VISION_MODEL:-}
  EXTRACT_MODE: ${EXTRACT_MODE:-text}
  ZAI_API_KEY: ${ZAI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  api:
    build: .
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    environment: *env
    ports: ["${API_PORT:-8000}:8000"]
  ui:
    build: .
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment: *env
    ports: ["${UI_PORT:-8501}:8501"]
